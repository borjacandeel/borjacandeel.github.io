<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC OS — Borja Candel</title>
<meta name="description" content="BC OS: el portfolio de Borja Candel convertido en un escritorio con ventanas, Dock y Terminal.">
<meta name="theme-color" content="#0b1019">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Helvetica Neue",system-ui,sans-serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
--win:#f6f6f8;--win-2:#ffffff;--bar:#e9e9ec;--line:rgba(0,0,0,.1);--label:#1d1d1f;--label-2:#6e6e73;--fill:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.2);
--accent:#0a84ff;--sel:rgba(10,132,255,.16);
--glass:rgba(246,246,248,.62);--glass-edge:rgba(255,255,255,.7);--glass-hi:rgba(255,255,255,.85);
--shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.25);
--menu-text:#1d1d1f;--spring:cubic-bezier(.22,1,.36,1);
color-scheme:light;
}
:root[data-mode="dark"]{
--win:#232326;--win-2:#2b2b2f;--bar:#2e2e32;--line:rgba(255,255,255,.1);--label:#f5f5f7;--label-2:#a1a1a6;--fill:rgba(120,120,128,.26);--fill-2:rgba(120,120,128,.38);
--sel:rgba(10,132,255,.32);--glass:rgba(30,30,34,.55);--glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.22);
--shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);--menu-text:#f5f5f7;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--label);-webkit-font-smoothing:antialiased;background:#0b1019}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.lg{fill:currentColor}

/* boot */
#boot{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#000;color:#f5f5f7;transition:opacity .6s ease}
#boot.out{opacity:0;pointer-events:none}
.boot-in{display:grid;justify-items:center;gap:44px}
.boot-in svg{width:min(42vw,220px);height:auto;fill:#f5f5f7}
.boot-bar{width:min(46vw,220px);height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:#f5f5f7;border-radius:3px;transition:width 1.4s cubic-bezier(.4,0,.2,1)}

/* desktop */
#desktop{position:fixed;inset:0;background:#0b1019 url(./assets/os/wall-desktop.jpg) center/cover no-repeat;transition:background .6s}
#desktop[data-wall="aurora"]{background:radial-gradient(60% 60% at 20% 20%,#5e5ce6,transparent 70%),radial-gradient(60% 60% at 80% 30%,#ff375f,transparent 70%),radial-gradient(70% 70% at 50% 90%,#0a84ff,transparent 70%),#1c1c1e}
#desktop[data-wall="graphite"]{background:linear-gradient(160deg,#3a3a3c,#1c1c1e 60%,#000)}
#desktop[data-wall="day"]{background:radial-gradient(70% 70% at 50% 40%,#ffffff,#dfe6f2 60%,#b9c6dc)}
@media (max-width:760px){#desktop{background-image:url(./assets/os/wall-mobile.jpg)}}

/* menu bar (Liquid Glass) */
.menubar{position:absolute;left:0;right:0;top:0;height:30px;z-index:900;display:flex;align-items:center;gap:4px;padding:0 10px;color:var(--menu-text);font-size:13px;font-weight:500;
background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:inset 0 -.5px 0 var(--line),inset 0 1px 0 var(--glass-hi)}
.mb-btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:0;border-radius:6px;background:transparent;cursor:default;white-space:nowrap}
.mb-btn:hover,.mb-btn[aria-expanded="true"]{background:var(--fill-2)}
.mb-logo svg{height:12px;width:auto;fill:currentColor}
.mb-app{font-weight:700}
.mb-spacer{flex:1}
.mb-right{display:flex;align-items:center;gap:2px}
.mb-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mb-clock{font-variant-numeric:tabular-nums}
@media (max-width:760px){.mb-menus,.mb-hide-sm{display:none}}

/* dropdown menus */
.drop{position:absolute;z-index:950;min-width:230px;padding:5px;border-radius:10px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(0,0,0,.28),0 0 0 .5px var(--line);font-size:13px;transform-origin:top left;animation:drop .18s ease-out}
@keyframes drop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.drop button{display:flex;justify-content:space-between;gap:20px;width:100%;padding:5px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:default}
.drop button:hover{background:var(--accent);color:#fff}
.drop kbd{font:inherit;opacity:.6}
.drop hr{border:0;height:1px;margin:4px 8px;background:var(--line)}

/* desktop icons */
.icons{position:absolute;right:18px;top:48px;display:grid;gap:14px;justify-items:center;z-index:5}
.dicon{display:grid;justify-items:center;gap:5px;width:86px;padding:6px 4px;border:0;border-radius:8px;background:none;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:default;touch-action:none}
.dicon:focus,.dicon.sel{background:rgba(255,255,255,.18)}
.dicon .ai{width:56px;height:56px;border-radius:13px}
@media (max-width:760px){.icons{display:none}}

/* app icons (squircles) */
.ai{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:23%;background:var(--g,#0a84ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 6px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.25);overflow:hidden}
.ai::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 46%);pointer-events:none}
.ai svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.ai svg.fill{fill:#fff;stroke:none}
.ai-term svg{fill:none;stroke:#30d158}
.ai-mk svg{width:62%;stroke:none}

/* dock */
.dock-wrap{position:absolute;left:0;right:0;bottom:8px;z-index:800;display:flex;justify-content:center;pointer-events:none}
.dock{display:flex;align-items:flex-end;gap:6px;height:72px;padding:8px 10px;border-radius:24px;pointer-events:auto;
background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-edge),0 10px 40px rgba(0,0,0,.3)}
.dock-sep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line)}
.dk{position:relative;flex:none;width:calc(52px * var(--s,1));height:calc(52px * var(--s,1));padding:0;border:0;background:none;cursor:default;transition:width .12s ease-out,height .12s ease-out}
.dock:not(:hover) .dk{transition:width .35s var(--spring),height .35s var(--spring)}
.dk .ai{width:100%;height:100%}
.dk::after{content:"";position:absolute;left:50%;bottom:-7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--menu-text);opacity:0;transition:opacity .3s}
.dk.open::after{opacity:.75}
.dk .tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);padding:4px 10px;border-radius:7px;white-space:nowrap;font-size:12px;font-weight:500;color:var(--label);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 4px 14px rgba(0,0,0,.2),0 0 0 .5px var(--line);opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover .tip{opacity:1}
.dk.bounce{animation:bounce .9s cubic-bezier(.3,.6,.4,1) 2}
@keyframes bounce{0%,100%{transform:none}35%{transform:translateY(-22px)}60%{transform:translateY(0)}75%{transform:translateY(-6px)}}
@media (max-width:760px){.dock{height:62px;gap:4px;padding:7px 8px;max-width:calc(100vw - 16px);overflow-x:auto}.dk{width:44px;height:44px}.dock-sep{display:none}}

/* windows */
#windows{position:absolute;inset:30px 0 0;z-index:10}
.win{position:absolute;display:flex;flex-direction:column;min-width:300px;min-height:200px;border-radius:12px;overflow:hidden;background:var(--win);box-shadow:var(--shadow);will-change:transform}
.win.anim{transition:left .45s var(--spring),top .45s var(--spring),width .45s var(--spring),height .45s var(--spring),border-radius .3s}
.win.max{border-radius:0}
.win-bar{position:relative;flex:none;display:flex;align-items:center;height:38px;padding:0 13px;background:var(--bar);border-bottom:1px solid var(--line);cursor:default;user-select:none;touch-action:none}
.win-title{position:absolute;left:90px;right:90px;text-align:center;font-size:13px;font-weight:600;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.win.front .win-title{color:var(--label)}
.lights{position:relative;z-index:1;display:flex;gap:8px}
.lights button{position:relative;width:12px;height:12px;padding:0;border:0;border-radius:50%;cursor:default;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);background:#c7c7cc}
.lights button::before{content:"";position:absolute;inset:-6px}
.win.front .lights .l-close{background:#ff5f57}.win.front .lights .l-min{background:#febc2e}.win.front .lights .l-zoom{background:#28c840}
.lights:hover .l-close{background:#ff5f57}.lights:hover .l-min{background:#febc2e}.lights:hover .l-zoom{background:#28c840}
:root[data-mode="dark"] .lights button{background:#4a4a4e}
.lights button::after{position:absolute;inset:0;display:grid;place-items:center;font:700 10px/12px var(--font);color:rgba(0,0,0,.6);opacity:0}
.l-close::after{content:"\00d7"}.l-min::after{content:"\2212"}.l-zoom::after{content:"+"}
.lights:hover button::after{opacity:1}
.win-body{position:relative;flex:1;overflow:auto;background:var(--win-2)}
.win-rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:2}
@media (max-width:760px){.win-rs{display:none}.win{border-radius:14px}}

/* spotlight */
.spot{position:absolute;left:50%;top:18vh;z-index:960;width:min(640px,calc(100vw - 32px));transform:translateX(-50%);border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);box-shadow:inset 0 1px 0 var(--glass-hi),0 30px 80px rgba(0,0,0,.4),0 0 0 .5px var(--line);overflow:hidden;animation:spot .22s var(--spring)}
@keyframes spot{from{opacity:0;transform:translateX(-50%) scale(.96)}}
.spot-in{display:flex;align-items:center;gap:12px;padding:14px 18px}
.spot-in svg{width:22px;height:22px;fill:none;stroke:var(--label-2);stroke-width:2;stroke-linecap:round;flex:none}
.spot input{flex:1;border:0;background:none;font:400 22px var(--font);color:var(--label);outline:none}
.spot ul{list-style:none;margin:0;padding:6px;border-top:1px solid var(--line);max-height:50vh;overflow:auto}
.spot li button{display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:15px;cursor:default}
.spot li button .ai{width:28px;height:28px;border-radius:7px;flex:none}
.spot li button[aria-selected="true"]{background:var(--accent);color:#fff}

/* app content */
.pad{padding:22px 26px 28px}
.h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0 0 16px;color:var(--label-2);font-size:14px}
.p{color:var(--label-2);font-size:14px;line-height:1.55;margin:0 0 10px}
.p strong{color:var(--label)}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:10px 0 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--fill);font-size:12px;font-weight:500}
.chip svg{width:13px;height:13px}
.about{display:grid;grid-template-columns:200px 1fr;gap:24px}
.about img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:14px;background:radial-gradient(80% 60% at 50% 30%,#fff,#d9d9e0)}
:root[data-mode="dark"] .about img{background:radial-gradient(80% 60% at 50% 30%,#3c3c41,#0b0b0d)}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;padding:12px;border-radius:12px;background:var(--fill)}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--label-2)}
@media (max-width:600px){.about{grid-template-columns:1fr}.about img{max-width:220px}}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat > div{padding:14px;border-radius:12px;background:var(--fill)}
.cat h3{display:flex;align-items:center;gap:8px;margin:0;font-size:14px}
.cat h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.split{display:grid;grid-template-columns:minmax(200px,38%) 1fr;height:100%}
.side{border-right:1px solid var(--line);overflow:auto;background:var(--win);padding:8px}
.side button{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:13px;line-height:1.35;cursor:default}
.side button b{flex:none;font-size:11px;color:var(--label-2);font-variant-numeric:tabular-nums;padding-top:1px}
.side button[aria-selected="true"]{background:var(--accent);color:#fff}
.side button[aria-selected="true"] b{color:rgba(255,255,255,.8)}
.detail{overflow:auto}
.detail ul{padding-left:18px;margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--label-2)}
.mk{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mk span{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#fff;box-shadow:0 0 0 .5px var(--line)}
.mk svg{width:26px;height:auto}
@media (max-width:600px){.split{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{border-right:0;border-bottom:1px solid var(--line);max-height:38%}}
.folder{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:16px}
.file{display:grid;justify-items:center;gap:8px;padding:12px 6px;border:0;border-radius:10px;background:none;text-align:center;font-size:12px;font-weight:500;cursor:default}
.file:hover,.file:focus{background:var(--sel)}
.file .ai{width:58px;height:58px;border-radius:12px}
.term{height:100%;padding:12px 14px;background:#1d1d1f;color:#e5e5ea;font:500 13px/1.6 var(--mono);overflow:auto;cursor:text}
.term .p_{color:#30d158}.term .ac{color:#64d2ff}.term .dim{color:#8e8e93}.term .er{color:#ff6961}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term input{width:60%;border:0;background:none;color:inherit;font:inherit;outline:none;caret-color:#f5f5f7}
.frame{width:100%;height:100%;border:0;display:block;background:#fff}
.browser{display:flex;flex-direction:column;height:100%}
.url{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--win)}
.url span{flex:1;padding:5px 12px;border-radius:8px;background:var(--fill);font-size:13px;color:var(--label-2);text-align:center}
.mail-f{display:grid;gap:0}
.mail-f label{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--label-2)}
.mail-f input,.mail-f textarea{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--label);outline:none}
.mail-f textarea{width:100%;min-height:180px;padding:14px 18px;resize:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:0;border-radius:8px;background:var(--fill);font-size:13px;font-weight:600;cursor:default;text-decoration:none;color:var(--label)}
.btn.pri{background:var(--accent);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.set{display:grid;gap:18px}
.set h3{margin:0 0 8px;font-size:13px;color:var(--label-2);font-weight:600}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{padding:5px 14px;border:0;border-radius:7px;background:none;font-size:13px;cursor:default}
.seg button[aria-pressed="true"]{background:var(--win-2);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.walls{display:flex;gap:10px;flex-wrap:wrap}
.walls button{width:96px;height:62px;border:2px solid transparent;border-radius:10px;cursor:default;background-size:cover;background-position:center}
.walls button[aria-pressed="true"]{border-color:var(--accent)}
.route{width:100%;height:140px;margin-top:12px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--c,#FC4C02)}
.about-os{display:grid;justify-items:center;text-align:center;gap:8px;padding:28px}
.about-os svg{width:120px;height:auto;fill:var(--label)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (prefers-reduced-transparency:reduce){.menubar,.dock,.drop,.spot{background:var(--win);-webkit-backdrop-filter:none;backdrop-filter:none}}

</style>
</head>

      <div class="pad set"><div><h3>Apariencia</h3><div class="seg" data-mode>${['auto', 'light', 'dark'].map(m => `<button data-v="${m}" aria-pressed="${pref.mode === m}">${{ auto: 'Automática', light: 'Clara', dark: 'Oscura' }[m]}</button>`).join('')}</div></div>
      <div><h3>Fondo de pantalla</h3><div class="walls" data-wall>${[['midnight', 'url(./assets/os/wall-desktop.jpg)'], ['aurora', 'radial-gradient(60% 60% at 20% 20%,#5e5ce6,transparent 70%),radial-gradient(60% 60% at 80% 30%,#ff375f,transparent 70%),radial-gradient(70% 70% at 50% 90%,#0a84ff,transparent 70%),#1c1c1e'], ['graphite', 'linear-gradient(160deg,#3a3a3c,#1c1c1e 60%,#000)'], ['day', 'radial-gradient(70% 70% at 50% 40%,#fff,#dfe6f2 60%,#b9c6dc)']].map(([k, bg]) => `<button data-v="${k}" aria-label="Fondo ${k}" aria-pressed="${pref.wall === k}" style="background:${bg};background-size:cover"></button>`).join('')}</div></div></div>`,
      init: (w) => {
        const seg = (sel, key) => $$(`${sel} button`, w).forEach(b => b.addEventListener('click', () => { pref[key] = b.dataset.v; applyLook(); $$(`${sel} button`, w).forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
        seg('[data-mode]', 'mode'); seg('[data-wall]', 'wall');
      } },
    os: { name: 'Acerca de BC OS', icon: 'os', w: 380, h: 330, dock: false, html: () => `
      <div class="about-os"><svg viewBox="${D.bcView}"><use href="#bc-logo"></use></svg><h1 class="h1">BC OS</h1><p class="sub" style="margin:0">Versión 1.0</p><p class="p">Un escritorio hecho con HTML, CSS y JavaScript para enseñar mi portfolio.</p><a class="btn" href="./index.html">Volver al portfolio</a></div>` },
  };
  const DOCK = ['about', 'skills', 'exp', 'projects', 'edu', 'term', '|', 'web', 'music', 'bike', 'mail', 'cv', 'settings'];

  /* ---------- dock ---------- */
  const dock = $('.dock');
  dock.innerHTML = DOCK.map(k => k === '|' ? '<span class="dock-sep"></span>' : `<button class="dk" data-app="${k}" aria-label="${APPS[k].name}">${icon(APPS[k].icon)}<span class="tip">${APPS[k].name}</span></button>`).join('');
  $$('.dk', dock).forEach(b => b.addEventListener('click', () => launch(b.dataset.app)));
  if (!reduce) {
    dock.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse' || small()) return;
      $$('.dk', dock).forEach(b => { const r = b.getBoundingClientRect(); const d = Math.abs(e.clientX - (r.left + r.width / 2)); b.style.setProperty('--s', (1 + 0.55 * Math.max(0, 1 - d / 130) ** 1.6).toFixed(3)); });
    });
    dock.addEventListener('pointerleave', () => $$('.dk', dock).forEach(b => b.style.setProperty('--s', 1)));
  }
  const dockBtn = (k) => $(`.dk[data-app="${k}"]`, dock);

  /* ---------- window manager ---------- */
  const layer = $('#windows');
  const wins = new Map();
  let z = 10, cascade = 0;
  const area = () => ({ w: layer.clientWidth, h: layer.clientHeight - (small() ? 80 : 92) });
  const focus = (w) => {
    if (!w) return;
    w.style.zIndex = ++z;
    $$('.win', layer).forEach(x => x.classList.toggle('front', x === w));
    $('.mb-app').textContent = APPS[w.dataset.app].name;
  };
  const front = () => $$('.win', layer).filter(w => !w.hidden).sort((a, b) => b.style.zIndex - a.style.zIndex)[0];
  const fromRect = (el, w) => {                       /* animate a window out of (or back into) an icon */
    const a = el.getBoundingClientRect(), b = w.getBoundingClientRect();
    const s = Math.max(0.06, a.width / b.width);
    return `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px,${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${s})`;
  };
  const launch = (k, from) => {
    const ex = wins.get(k);
    if (ex) {
      if (ex.hidden) restore(ex); else focus(ex);
      return ex;
    }
    const app = APPS[k], A = area();
    const w = document.createElement('section');
    w.className = 'win'; w.dataset.app = k; w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', app.name);
    w.innerHTML = `<header class="win-bar"><div class="lights"><button class="l-close" aria-label="Cerrar"></button><button class="l-min" aria-label="Minimizar"></button><button class="l-zoom" aria-label="Ampliar"></button></div><span class="win-title">${esc(app.title || app.name)}</span></header><div class="win-body">${app.html()}</div><div class="win-rs" aria-hidden="true"></div>`;
    if (small()) Object.assign(w.style, { left: '8px', top: '8px', width: (A.w - 16) + 'px', height: (A.h - 8) + 'px' });
    else {
      const W = Math.min(app.w, A.w - 40), H = Math.min(app.h, A.h - 20);
      const x = Math.max(20, (A.w - W) / 2 + (cascade % 6) * 28 - 70), y = Math.max(10, (A.h - H) / 2 + (cascade % 6) * 24 - 50);
      cascade++;
      Object.assign(w.style, { left: x + 'px', top: y + 'px', width: W + 'px', height: H + 'px' });
    }
    layer.appendChild(w); wins.set(k, w); focus(w);
    if (app.init) app.init(w);
    wire(w);
    const btn = dockBtn(k);
    if (btn) { btn.classList.add('open'); if (!reduce) { btn.classList.add('bounce'); setTimeout(() => btn.classList.remove('bounce'), 900); } }
    const src = from || btn;
    if (!reduce && src) w.animate([{ transform: fromRect(src, w), opacity: 0.2 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: SPRING });
    return w;
  };
  const close = (w) => {
    const k = w.dataset.app;
    const done = () => { w.remove(); wins.delete(k); const b = dockBtn(k); b && b.classList.remove('open'); const f = front(); if (f) focus(f); else $('.mb-app').textContent = 'Escritorio'; };
    if (reduce) return done();
    w.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.92)', opacity: 0 }], { duration: 200, easing: 'ease-in' }).onfinish = done;
  };
  const minimize = (w) => {
    const b = dockBtn(w.dataset.app);
    const done = () => { w.hidden = true; const f = front(); if (f) focus(f); };
    if (reduce || !b) return done();
    w.animate([{ transform: 'none', opacity: 1 }, { transform: fromRect(b, w), opacity: 0.3 }], { duration: 480, easing: 'cubic-bezier(.5,0,.75,0)' }).onfinish = done;
  };
  const restore = (w) => {
    w.hidden = false; focus(w);
    const b = dockBtn(w.dataset.app);
    if (!reduce && b) w.animate([{ transform: fromRect(b, w), opacity: 0.3 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: SPRING });
  };
  const zoom = (w) => {
    w.classList.add('anim');
    if (w.classList.contains('max')) { Object.assign(w.style, w._prev); w.classList.remove('max'); }
    else { w._prev = { left: w.style.left, top: w.style.top, width: w.style.width, height: w.style.height }; const A = area(); Object.assign(w.style, { left: '0px', top: '0px', width: A.w + 'px', height: (layer.clientHeight) + 'px' }); w.classList.add('max'); }
    setTimeout(() => w.classList.remove('anim'), 480);
  };
  const wire = (w) => {
    w.addEventListener('pointerdown', () => focus(w), true);
    $('.l-close', w).addEventListener('click', () => close(w));
    $('.l-min', w).addEventListener('click', () => minimize(w));
    $('.l-zoom', w).addEventListener('click', () => zoom(w));
    const bar = $('.win-bar', w);
    bar.addEventListener('dblclick', (e) => { if (!e.target.closest('.lights')) zoom(w); });
    let d = null;
    bar.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lights') || small() || w.classList.contains('max')) return;
      bar.setPointerCapture(e.pointerId);
      d = { id: e.pointerId, dx: e.clientX - w.offsetLeft, dy: e.clientY - w.offsetTop };   /* keep the grab offset */
    });
    bar.addEventListener('pointermove', (e) => {
      if (!d || e.pointerId !== d.id) return;
      const maxX = layer.clientWidth - 80, maxY = layer.clientHeight - 40;
      w.style.left = Math.min(maxX, Math.max(80 - w.offsetWidth, e.clientX - d.dx)) + 'px';
      w.style.top = Math.min(maxY, Math.max(0, e.clientY - d.dy)) + 'px';
    });
    const end = () => { d = null; };
    bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
    const rs = $('.win-rs', w); let r = null;
    rs.addEventListener('pointerdown', (e) => { rs.setPointerCapture(e.pointerId); r = { id: e.pointerId, x: e.clientX, y: e.clientY, w: w.offsetWidth, h: w.offsetHeight }; });
    rs.addEventListener('pointermove', (e) => { if (!r || e.pointerId !== r.id) return; w.style.width = Math.max(320, r.w + e.clientX - r.x) + 'px'; w.style.height = Math.max(220, r.h + e.clientY - r.y) + 'px'; });
    rs.addEventListener('pointerup', () => { r = null; });
  };

  /* ---------- terminal ---------- */
  const terminal = (w) => {
    const out = $('[data-out]', w), inp = $('[data-in]', w), box = $('[data-term]', w);
    const hist = []; let hi = 0;
    const print = (h) => { const d = document.createElement('div'); d.className = 'ln'; d.innerHTML = h; out.appendChild(d); box.scrollTop = box.scrollHeight; };
    const cmds = {
      help: () => 'Comandos: <span class="ac">whoami</span>, <span class="ac">sobre</span>, <span class="ac">habilidades</span>, <span class="ac">experiencia</span>, <span class="ac">proyectos</span>, <span class="ac">educacion</span>, <span class="ac">contacto</span>, <span class="ac">ls</span>, <span class="ac">open</span> &lt;app&gt;, <span class="ac">neofetch</span>, <span class="ac">tema</span> claro|oscuro, <span class="ac">date</span>, <span class="ac">clear</span>, <span class="ac">exit</span>',
      whoami: () => 'borja candel',
      sobre: () => D.about.map(p => p.replace(/<[^>]+>/g, '')).join('\n\n'),
      habilidades: () => D.skills.map(s => `<span class="ac">${s.t.replace('&amp;', '&')}</span>\n  ${s.chips.map(c => c.n.replace('&amp;', '&')).join(' · ')}`).join('\n'),
      experiencia: () => '<span class="ac">Markha · Sueca (Valencia) — 2025 · 8 meses</span>\n' + D.exp.map((e, i) => `  ${String(i + 1).padStart(2, '0')}  ${e.t}`).join('\n'),
      proyectos: () => D.projects.map(p => `<span class="ac">${p.t}</span>\n  ${p.sub}`).join('\n'),
      educacion: () => D.edu.map(e => `${e.label.padEnd(9)} ${e.t} — ${e.a}`).join('\n'),
      contacto: () => 'email     borjacs07@gmail.com\nteléfono  611 100 616\nubicación Valencia',
      ls: () => Object.keys(APPS).filter(k => k !== 'os').map(k => `<span class="ac">${k}</span>`).join('  '),
      date: () => new Date().toLocaleString('es-ES'),
      neofetch: () => `<span class="ac">  ██████   ██████ </span>  <b>borja</b>@<b>bc-os</b>
<span class="ac">  ██   ██ ██      </span>  ------------
<span class="ac">  ██████  ██      </span>  SO: BC OS 1.0 (web)
<span class="ac">  ██   ██ ██      </span>  Rol: Técnico de Sistemas y Redes
<span class="ac">  ██████   ██████ </span>  Estudios: ASIR · IES Abastos
                     Shell: zsh (más o menos)`,
    };
    const alias = { about: 'sobre', skills: 'habilidades', exp: 'experiencia', projects: 'proyectos', edu: 'educacion', contact: 'contacto', '?': 'help', ayuda: 'help' };
    const run = (raw) => {
      const line = raw.trim();
      print(`<span class="p_">~ %</span> ${esc(line)}`);
      if (!line) return;
      hist.push(line); hi = hist.length;
      const [c0, ...args] = line.split(/\s+/); const c = alias[c0.toLowerCase()] || c0.toLowerCase();
      if (c === 'clear') { out.innerHTML = ''; return; }
      if (c === 'exit') { close(w); return; }
      if (c === 'open') { const k = (args[0] || '').toLowerCase(); if (APPS[k]) { launch(k); print(`<span class="dim">abriendo ${k}…</span>`); } else print(`<span class="er">open: no existe la app «${esc(args[0] || '')}». Prueba «ls».</span>`); return; }
      if (c === 'tema' || c === 'theme') { const m = { claro: 'light', light: 'light', oscuro: 'dark', dark: 'dark', auto: 'auto' }[(args[0] || '').toLowerCase()]; if (m) { pref.mode = m; applyLook(); print('hecho'); } else print('uso: tema claro|oscuro|auto'); return; }
      if (c === 'sudo') { print('<span class="er">sudo: buen intento. Aquí el administrador soy yo.</span>'); return; }
      if (cmds[c]) print(cmds[c]()); else print(`<span class="er">zsh: comando no encontrado: ${esc(c0)}</span>  <span class="dim">(escribe «help»)</span>`);
    };
    print('<span class="dim">Último inicio de sesión: ' + new Date().toLocaleString('es-ES') + '</span>');
    print('Bienvenido a BC OS. Escribe <span class="ac">help</span> para ver los comandos.');
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { run(inp.value); inp.value = ''; }
      else if (e.key === 'ArrowUp') { if (hi > 0) inp.value = hist[--hi]; e.preventDefault(); }
      else if (e.key === 'ArrowDown') { inp.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ''); e.preventDefault(); }
    });
    box.addEventListener('click', () => inp.focus());
    setTimeout(() => inp.focus({ preventScroll: true }), 300);
  };

  /* ---------- menu bar ---------- */
  let drop = null;
  const closeDrop = () => { if (drop) { drop.remove(); drop = null; $$('.mb-btn[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false')); } };
  const MENUS = {
    bc: [['Acerca de BC OS', () => launch('os')], '-', ['Ajustes…', () => launch('settings'), '⌘,'], ['Buscar…', () => spot(), '⌘K'], '-', ['Reiniciar…', () => { closeDrop(); boot(); }], ['Volver al portfolio', () => { location.href = './index.html'; }]],
    file: [['Nueva ventana de Terminal', () => launch('term'), '⌘T'], ['Nuevo mensaje', () => launch('mail')], '-', ['Cerrar ventana', () => { const f = front(); f && close(f); }, '⌘W']],
    view: [['Modo claro', () => { pref.mode = 'light'; applyLook(); }], ['Modo oscuro', () => { pref.mode = 'dark'; applyLook(); }], ['Automático', () => { pref.mode = 'auto'; applyLook(); }]],
    window: [['Minimizar', () => { const f = front(); f && minimize(f); }, '⌘M'], ['Ampliar', () => { const f = front(); f && zoom(f); }], '-', ...Object.keys(APPS).filter(k => k !== 'os').map(k => [APPS[k].name, () => launch(k)])],
    help: [['Comandos de Terminal', () => { const t = launch('term'); }], ['Escribir a Borja', () => launch('mail')]],
  };
  $$('.mb-btn[data-menu]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = b.getAttribute('aria-expanded') === 'true'; closeDrop(); if (open) return;
    b.setAttribute('aria-expanded', 'true');
    drop = document.createElement('div'); drop.className = 'drop'; drop.setAttribute('role', 'menu');
    const r = b.getBoundingClientRect(); drop.style.left = Math.min(r.left, innerWidth - 250) + 'px'; drop.style.top = (r.bottom + 4) + 'px';
    MENUS[b.dataset.menu].forEach(it => {
      if (it === '-') { drop.appendChild(document.createElement('hr')); return; }
      const x = document.createElement('button'); x.setAttribute('role', 'menuitem'); x.innerHTML = `<span>${it[0]}</span>${it[2] ? `<kbd>${it[2]}</kbd>` : ''}`;
      x.addEventListener('click', () => { closeDrop(); it[1](); }); drop.appendChild(x);
    });
    document.body.appendChild(drop); drop.querySelector('button').focus({ preventScroll: true });
  }));
  document.addEventListener('click', closeDrop);

  /* ---------- spotlight ---------- */
  let spotEl = null;
  const spot = () => {
    if (spotEl) { spotEl.remove(); spotEl = null; return; }
    spotEl = document.createElement('div'); spotEl.className = 'spot'; spotEl.setAttribute('role', 'dialog'); spotEl.setAttribute('aria-label', 'Buscar');
    spotEl.innerHTML = '<div class="spot-in"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg><input placeholder="Buscar apps de BC OS" aria-label="Buscar"></div><ul role="listbox"></ul>';
    document.body.appendChild(spotEl);
    const inp = $('input', spotEl), ul = $('ul', spotEl); let sel = 0, list = [];
    const draw = () => {
      const t = inp.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      list = Object.keys(APPS).filter(k => (APPS[k].name + ' ' + k).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(t));
      sel = Math.min(sel, Math.max(0, list.length - 1));
      ul.innerHTML = list.map((k, i) => `<li><button role="option" data-k="${k}" aria-selected="${i === sel}">${icon(APPS[k].icon)}${APPS[k].name}</button></li>`).join('');
      $$('button', ul).forEach(b => b.addEventListener('click', () => { launch(b.dataset.k); spot(); }));
    };
    inp.addEventListener('input', () => { sel = 0; draw(); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { sel = Math.min(list.length - 1, sel + 1); draw(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
      if (e.key === 'Enter' && list[sel]) { launch(list[sel]); spot(); }
      if (e.key === 'Escape') spot();
    });
    draw(); inp.focus();
  };
  $('[data-spot]').addEventListener('click', (e) => { e.stopPropagation(); spot(); });

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); spot(); }
    else if (mod && e.key.toLowerCase() === 'w') { const f = front(); if (f) { e.preventDefault(); close(f); } }
    else if (mod && e.key.toLowerCase() === 'm') { const f = front(); if (f) { e.preventDefault(); minimize(f); } }
    else if (mod && e.key === ',') { e.preventDefault(); launch('settings'); }
    else if (e.key === 'Escape') { if (drop) closeDrop(); else if (spotEl) spot(); }
  });

  /* ---------- desktop icons: double-click to open, drag to move ---------- */
  $$('.dicon').forEach(ic => {
    let d = null;
    ic.addEventListener('dblclick', () => launch(ic.dataset.app, ic));
    ic.addEventListener('keydown', (e) => { if (e.key === 'Enter') launch(ic.dataset.app, ic); });
    ic.addEventListener('pointerdown', (e) => { $$('.dicon').forEach(x => x.classList.toggle('sel', x === ic)); ic.setPointerCapture(e.pointerId); d = { x: e.clientX, y: e.clientY, l: ic.offsetLeft, t: ic.offsetTop, moved: false }; });
    ic.addEventListener('pointermove', (e) => {
      if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (!d.moved && Math.hypot(dx, dy) < 5) return;
      d.moved = true; ic.style.position = 'relative'; ic.style.left = dx + 'px'; ic.style.top = dy + 'px';
    });
    ic.addEventListener('pointerup', () => { if (d && d.moved) { ic.style.transition = 'left .45s var(--spring),top .45s var(--spring)'; ic.style.left = '0px'; ic.style.top = '0px'; setTimeout(() => { ic.style.transition = ''; }, 460); } d = null; });
  });

  /* ---------- clock ---------- */
  const clock = $('.mb-clock');
  const tick = () => { const n = new Date(); clock.textContent = n.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) + '  ' + n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); };
  tick(); setInterval(tick, 15000);

  /* ---------- boot ---------- */
  const bootEl = $('#boot');
  const boot = () => {
    $$('.win', layer).forEach(w => w.remove()); wins.clear(); $$('.dk.open').forEach(b => b.classList.remove('open'));
    bootEl.classList.remove('out'); const bar = $('.boot-bar i'); bar.style.transition = 'none'; bar.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = ''; bar.style.width = '100%'; }));
    setTimeout(() => { bootEl.classList.add('out'); setTimeout(() => launch('about'), 350); }, reduce ? 200 : 1600);
  };
  bootEl.addEventListener('click', () => { bootEl.classList.add('out'); });
  addEventListener('resize', () => { if (small()) $$('.win', layer).forEach(w => Object.assign(w.style, { left: '8px', top: '8px', width: (layer.clientWidth - 16) + 'px', height: (layer.clientHeight - 88) + 'px' })); });
  boot();
})();

</script>
